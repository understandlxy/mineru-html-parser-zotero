name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath addon/manifest.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($manifest.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match manifest version $expectedTag"
          }

      - name: Package XPI
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -LiteralPath addon/manifest.json -Raw | ConvertFrom-Json
          $xpi = "dist/mineru-html-parser-$($manifest.version).xpi"
          gh release create $env:GITHUB_REF_NAME $xpi update.json --title "MinerU HTML Parser $($manifest.version)" --generate-notes
